<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RLTactic</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:ital,wght@1,700&display=swap">
<style>
:root{--ink:#10162b;--mute:#5a6690;--night:#e9edf8;--panel:#ffffff;--panel2:#edf1fb;--line:#cdd5ec;--blue:#2f7bff;--orange:#ff8a1f;--bad:#d23c3c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e9eefc;--mute:#9aa7cf;--night:#080d1c;--panel:#111a33;--panel2:#18234a;--line:#26335f}}
:root[data-theme="dark"]{--ink:#e9eefc;--mute:#9aa7cf;--night:#080d1c;--panel:#111a33;--panel2:#18234a;--line:#26335f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0 auto;max-width:1180px;min-height:100vh;color:var(--ink);font:16px/1.45 "Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:12px 12px 28px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
 background:radial-gradient(700px 380px at 0% -8%,rgba(47,123,255,.2),transparent 62%),radial-gradient(700px 380px at 100% -8%,rgba(255,138,31,.16),transparent 62%),var(--night);background-attachment:fixed}
.brand{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:2px 0 12px}
.logo{font:italic 700 24px/1 "Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;letter-spacing:.02em}
#st{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--mute);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 11px}
#st::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--blue)}
button,input{font:inherit;color:var(--ink);min-height:42px}
button{cursor:pointer;padding:8px 14px;border-radius:11px;border:1px solid var(--line);background:var(--panel);transition:transform .08s,background .15s}
button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
input{padding:8px 12px;border-radius:11px;border:1px solid var(--line);background:var(--panel)}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:11px;min-height:38px;padding:6px 16px;font-weight:600}
.seg button.on{background:var(--blue);color:#fff}
.cta{border:0;color:#1c1204;font-weight:600;background:linear-gradient(100deg,#ffa43a,var(--orange));border-radius:14px;padding:8px 18px}
.ghost.on{background:var(--bad);border-color:var(--bad);color:#fff}
.sw{width:34px;height:34px;min-height:0;padding:0;border-radius:50%;border:2px solid var(--line)}
.sw.on{box-shadow:0 0 0 2px var(--night),0 0 0 4px var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:0 0 10px}
.grp{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stage{border-radius:18px;overflow:hidden;border:1px solid var(--line);box-shadow:-14px 0 44px -22px rgba(47,123,255,.7),14px 0 44px -22px rgba(255,138,31,.65)}
#sv{width:100%;height:auto;display:block;touch-action:none;background:#070c1a}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
input{-webkit-user-select:text;user-select:text}
button:disabled{opacity:.4;cursor:default}
.layout{display:grid;gap:14px}
@media (min-width:900px){.layout{grid-template-columns:minmax(0,1fr) 310px;align-items:start}}
.main,.side{display:grid;gap:12px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px}
.panel h3{margin:0 0 8px;font:italic 700 19px/1 "Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;letter-spacing:.02em}
.dock{display:grid;gap:10px;margin-top:0}
.prow{display:grid;grid-template-columns:30px 1fr 1fr;gap:6px;align-items:center;margin-bottom:6px;padding:3px;border-radius:12px}
.prow.sel{background:var(--panel2);box-shadow:0 0 0 2px var(--blue)}
.prow input{min-height:36px;min-width:0;padding:4px 8px;font-size:14px}
.dot{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;color:#fff;font-weight:700;font-size:13px}
.dot.b{background:var(--blue)}.dot.o{background:var(--orange);color:#1c1204}
.panel ol{margin:4px 0 10px;padding-left:20px;font-size:14px}
.panel .tm{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;color:var(--mute);font-size:14px}
.chip{min-height:38px;min-width:42px;padding:4px 10px;font-weight:700}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.lrow{display:flex;gap:6px;align-items:center;margin-top:6px}
.lrow .ln{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow button{min-height:36px;padding:4px 10px}
.save{display:flex;gap:6px}
.lcard{margin-top:10px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel2)}
.lcard svg{display:block;width:100%;height:auto}
.lcard .lb2{display:flex;gap:6px;align-items:center;padding:8px}
.lcard .ln{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.lcard small{display:block;color:var(--mute);font-weight:400}
.lcard button{min-height:36px;padding:4px 10px}
.save input{flex:1;min-width:0}
.hint{color:var(--mute);font-size:14px}
.wide{width:100%;margin-top:8px}
</style>
</head>

<body>
<header class="brand"><span class="logo">RLTactic</span><span id="st">Çevrimdışı Mod</span></header>

<main id="app">
<div class="row">
  <div class="seg" role="group" aria-label="Mod"><button class="md on" data-m="1">1v1</button><button class="md" data-m="2">2v2</button><button class="md" data-m="3">3v3</button></div>
  <button id="bKick" class="cta">Yeni kickoff</button>
</div>
<div class="layout">
<div class="main">
<div class="stage">
<svg id="sv" viewBox="0 0 1000 640">
  <defs>
    <linearGradient id="fl" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#0f3277"/><stop offset=".5" stop-color="#0b1a2e"/><stop offset="1" stop-color="#6e3611"/></linearGradient>
    <pattern id="mow" width="88" height="600" patternUnits="userSpaceOnUse" x="60" y="20"><rect width="44" height="600" fill="#fff" fill-opacity=".035"/></pattern>
    <radialGradient id="haloB"><stop offset="0" stop-color="#2f7bff" stop-opacity=".55"/><stop offset="1" stop-color="#2f7bff" stop-opacity="0"/></radialGradient>
    <radialGradient id="haloO"><stop offset="0" stop-color="#ff8a1f" stop-opacity=".55"/><stop offset="1" stop-color="#ff8a1f" stop-opacity="0"/></radialGradient>
    <radialGradient id="haloW"><stop offset="0" stop-color="#fff" stop-opacity=".4"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="0" y="0" width="1000" height="640" fill="#070c1a"/>
  <rect x="60" y="20" width="880" height="600" fill="url(#fl)"/>
  <rect x="60" y="20" width="880" height="600" fill="url(#mow)"/>
  <rect x="20" y="245" width="40" height="150" fill="#2f7bff" fill-opacity=".35" stroke="#2f7bff" stroke-width="3" filter="url(#glow)"/>
  <rect x="940" y="245" width="40" height="150" fill="#ff8a1f" fill-opacity=".35" stroke="#ff8a1f" stroke-width="3" filter="url(#glow)"/>
  <rect x="60" y="20" width="880" height="600" fill="none" stroke="#cfe0ff" stroke-opacity=".7" stroke-width="3"/>
  <line x1="500" y1="20" x2="500" y2="620" stroke="#cfe0ff" stroke-opacity=".5" stroke-width="2.5"/>
  <circle cx="500" cy="320" r="85" fill="none" stroke="#cfe0ff" stroke-opacity=".5" stroke-width="2.5"/>
  <circle cx="500" cy="320" r="5" fill="#cfe0ff" fill-opacity=".6"/>
  <rect x="60" y="190" width="120" height="260" fill="none" stroke="#cfe0ff" stroke-opacity=".22" stroke-width="2"/>
  <rect x="820" y="190" width="120" height="260" fill="none" stroke="#cfe0ff" stroke-opacity=".22" stroke-width="2"/>
  <g filter="url(#glow)" fill="#ffc14d">
    <circle cx="148" cy="95" r="9"/><circle cx="852" cy="95" r="9"/><circle cx="148" cy="545" r="9"/><circle cx="852" cy="545" r="9"/>
    <circle cx="500" cy="58" r="9"/><circle cx="500" cy="582" r="9"/>
  </g>
  <g fill="none" stroke="#ffc14d" stroke-opacity=".45" stroke-width="2">
    <circle cx="148" cy="95" r="16"/><circle cx="852" cy="95" r="16"/><circle cx="148" cy="545" r="16"/><circle cx="852" cy="545" r="16"/>
    <circle cx="500" cy="58" r="16"/><circle cx="500" cy="582" r="16"/>
  </g>
  <g id="strokes" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></g>
  <g id="toks"></g>
</svg>
</div>
<div class="dock panel">
  <div class="grp">
    <div class="seg" role="group" aria-label="Araç"><button class="tl on" data-t="move">Taşı</button><button class="tl" data-t="pen">Kalem</button><button class="tl" data-t="arrow">Ok</button><button class="tl" data-t="rect">Kare</button><button class="tl" data-t="circle">Daire</button></div>
  </div>
  <div class="grp">
    <div class="seg" role="group" aria-label="Kalınlık"><button class="wd" data-w="3">İnce</button><button class="wd on" data-w="5">Orta</button><button class="wd" data-w="9">Kalın</button></div>
    <div class="sws" style="display:flex;gap:10px;align-items:center;padding:0 4px">
      <button class="sw on" data-c="#ffffff" style="background:#fff" aria-label="Beyaz"></button>
      <button class="sw" data-c="#ffd400" style="background:#ffd400" aria-label="Sarı"></button>
      <button class="sw" data-c="#00e5ff" style="background:#00e5ff" aria-label="Turkuaz"></button>
      <button class="sw" data-c="#ff5ca8" style="background:#ff5ca8" aria-label="Pembe"></button>
    </div>
  </div>
  <div class="grp"><button id="bUndo" disabled>Geri al</button><button id="bRedo" disabled>İleri al</button><button id="bClear" class="ghost">Çizimleri sil</button><button id="bReset" class="ghost">Dizilimi sıfırla</button></div>
</div>
<div class="panel">
  <h3>Animasyon</h3>
  <div class="grp"><button id="bAdd">Adım ekle</button><button id="bUpd">Adımı güncelle</button><button id="bDel">Adımı sil</button><button id="bPlay" class="cta">Oynat</button><button id="bFclr" class="ghost">Hepsini sil</button></div>
  <div class="chips" id="chips"></div>
</div>
</div>
<aside class="side">
  <div class="panel"><h3>Oyuncular</h3><div id="plist"></div><div class="hint">Sahada bir oyuncuya dokun, ismini ve rolünü yaz.</div></div>
  <div class="panel"><h3>Rotasyon</h3>
    <div class="tm"><span class="dot b"></span>Mavi takım</div><ol id="rotb"></ol>
    <div class="tm"><span class="dot o"></span>Turuncu takım</div><ol id="roto"></ol>
  </div>
  <div class="panel"><h3>Kayıtlı taktikler</h3>
    <div class="save"><input id="sname" maxlength="30" placeholder="Taktik adı"><button id="bSave">Kaydet</button></div>
    <div id="lib"></div>
  </div>
  <div class="panel"><h3>Dışa aktar</h3><button id="bPng" class="wide" style="margin-top:0">Sahayı PNG olarak indir</button><div class="hint" style="margin-top:6px">Sahanın şu anki halini, çizimler ve oyuncu etiketleriyle tek bir resim olarak indirir.</div></div>
</aside>
</div>
</main>
<datalist id="roles"><option value="First Man"><option value="Second Man"><option value="Last Man"><option value="Rotasyoncu"><option value="Destek"><option value="Kaleci"></datalist>

<script>
(function(){
  var FORM={1:{b1:1,o1:1,ball:1},2:{b1:1,b2:1,o1:1,o2:1,ball:1},3:{b1:1,b2:1,b3:1,o1:1,o2:1,o3:1,ball:1}};
  var ALL=["b1","b2","b3","o1","o2","o3","ball"];
  var SPOTS=[[280,170],[280,470],[170,301],[170,339],[104,320]];
  var KO={1:[[0],[1],[2],[3],[4]],2:[[0,1],[2,3],[0,4],[1,4],[0,3]],3:[[0,1,4],[2,3,4],[0,3,4],[2,1,4],[0,1,2]]};
  var mode=1,ko=0,tokens={},labels={},strokes={},frames=[],fsel=-1,tool="move",color="#ffffff",wid=5;
  var drag=null,cur=null,pid=null;
  var playing=false,backup=null,playRaf=0,undo=[],redo=[],rotQ=0;
  var $=function(i){return document.getElementById(i)};
  var sv=$("sv"),tg=$("toks"),sg=$("strokes"),st=$("st");
  var NS="http://www.w3.org/2000/svg",els={},labG={},rows={};
  function mk(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);return e}
  function status(t){st.textContent=t}
  function active(id){return !!FORM[mode][id]}
  function clone(o){return JSON.parse(JSON.stringify(o))}
  function snap(){var o={};ALL.forEach(function(id){o[id]={x:tokens[id].x,y:tokens[id].y}});return o}

  function resetForm(m){
    var set=KO[m][ko%KO[m].length];
    ALL.forEach(function(id){tokens[id]={x:500,y:320}});
    for(var i=0;i<m;i++){var s=SPOTS[set[i]];tokens["b"+(i+1)]={x:s[0],y:s[1]};tokens["o"+(i+1)]={x:1000-s[0],y:640-s[1]}}
  }
  function updKo(){var n=KO[mode].length;$("bKick").textContent="Yeni kickoff ("+((ko%n)+1)+"/"+n+")"}
  resetForm(1);

  ALL.forEach(function(id){
    var g=mk("g",{"class":"tok"});
    g.appendChild(mk("circle",{r:id==="ball"?38:46,fill:"url(#halo"+(id==="ball"?"W":id.charAt(0)==="b"?"B":"O")+")"}));
    if(id==="ball"){g.appendChild(mk("circle",{r:20,fill:"#fff",stroke:"#0a1226","stroke-width":3}))}
    else{
      g.appendChild(mk("rect",{x:-26,y:-16,width:52,height:32,rx:9,fill:id.charAt(0)==="b"?"#2f7bff":"#ff8a1f",stroke:"#fff","stroke-width":2.5}));
      g.appendChild(mk("rect",{x:-6,y:-11,width:20,height:22,rx:6,fill:"#fff","fill-opacity":.22,"pointer-events":"none"}));
      var t=mk("text",{"text-anchor":"middle",y:6,fill:"#fff","font-size":18,"font-weight":700,"pointer-events":"none"});
      t.textContent=id.charAt(1);g.appendChild(t);
      var lb=mk("g",{"pointer-events":"none"});g.appendChild(lb);labG[id]=lb;
    }
    g.setAttribute("data-id",id);tg.appendChild(g);els[id]=g;
  });

  function renderLabel(id){
    var g=labG[id];if(!g)return;g.textContent="";
    var L=labels[id]||{},n=(L.n||"").trim(),r=(L.r||"").trim();if(!n&&!r)return;
    var w=Math.max(n.length*8.4,r.length*6.8)+18,h=(n&&r)?36:22;
    g.appendChild(mk("rect",{x:-w/2,y:24,width:w,height:h,rx:8,fill:"#070c1a","fill-opacity":.85,stroke:id.charAt(0)==="b"?"#2f7bff":"#ff8a1f","stroke-width":1.5}));
    if(n){var t=mk("text",{"text-anchor":"middle",y:r?39:39,fill:"#fff","font-size":14,"font-weight":700});t.textContent=n;g.appendChild(t)}
    if(r){var t2=mk("text",{"text-anchor":"middle",y:n?52:39,fill:"#cfe0ff","font-size":11});t2.textContent=r;g.appendChild(t2)}
  }
  function place(id){var t=tokens[id];els[id].setAttribute("transform","translate("+t.x+" "+t.y+")");reqRot()}
  function placeAll(){ALL.forEach(function(id){place(id);els[id].style.display=active(id)?"":"none"})}
  placeAll();

  ALL.forEach(function(id){
    if(id==="ball")return;
    var d=document.createElement("div");d.className="prow";
    var dot=document.createElement("span");dot.className="dot "+id.charAt(0);dot.textContent=id.charAt(1);
    var nm=document.createElement("input");nm.className="nm";nm.placeholder="İsim";nm.maxLength=14;
    var rl=document.createElement("input");rl.className="rl";rl.placeholder="Rol";rl.maxLength=18;rl.setAttribute("list","roles");
    d.appendChild(dot);d.appendChild(nm);d.appendChild(rl);$("plist").appendChild(d);
    var R={row:d,nm:nm,rl:rl,t:null};rows[id]=R;
    function ch(){labels[id]={n:nm.value,r:rl.value};renderLabel(id);reqRot()}
    nm.oninput=ch;rl.oninput=ch;
  });

  function selectPlayer(id){
    ALL.forEach(function(i){if(rows[i])rows[i].row.classList.toggle("sel",i===id)});
    var R=rows[id];if(!R)return;
    if(R.row.scrollIntoView)R.row.scrollIntoView({block:"nearest"});
    R.nm.focus();
  }
  function dist(id){var a=tokens[id],b=tokens.ball;return Math.hypot(a.x-b.x,a.y-b.y)}
  function reqRot(){if(rotQ)return;rotQ=requestAnimationFrame(function(){rotQ=0;updSide()})}
  function updSide(){
    ["b","o"].forEach(function(tm){
      var ids=ALL.filter(function(i){return i.charAt(0)===tm&&active(i)});
      ids.sort(function(a,c){return dist(a)-dist(c)});
      var own=ids.slice().sort(function(a,c){return tm==="b"?tokens[a].x-tokens[c].x:tokens[c].x-tokens[a].x})[0];
      var ul=$("rot"+tm);ul.textContent="";
      ids.forEach(function(id,i){
        var L=labels[id]||{},li=document.createElement("li");
        var t=(L.n&&L.n.trim())?L.n.trim():(tm==="b"?"Mavi ":"Turuncu ")+id.charAt(1);
        if(L.r&&L.r.trim())t+=" · "+L.r.trim();
        var tag=[];if(i===0)tag.push("topa en yakın");if(id===own&&ids.length>1)tag.push("kaleye en yakın");
        if(tag.length)t+=" ("+tag.join(", ")+")";
        li.textContent=t;ul.appendChild(li);
      });
    });
  }

  function pathD(p){var d="";for(var i=0;i<p.length;i+=2)d+=(i?"L":"M")+p[i]+" "+p[i+1];return d}
  function strokeEl(s){
    var a={stroke:s.c||"#fff","stroke-width":s.w||5,fill:"none","stroke-linecap":"round","stroke-linejoin":"round"},p=s.p||[],k=s.k||"pen";
    if(k==="pen"){a.d=pathD(p);return mk("path",a)}
    var x1=p[0],y1=p[1],x2=p[2]===undefined?x1:p[2],y2=p[3]===undefined?y1:p[3];
    if(k==="rect"){a.x=Math.min(x1,x2);a.y=Math.min(y1,y2);a.width=Math.abs(x2-x1);a.height=Math.abs(y2-y1);a.rx=4;return mk("rect",a)}
    if(k==="circle"){a.cx=x1;a.cy=y1;a.r=Math.hypot(x2-x1,y2-y1);return mk("circle",a)}
    var an=Math.atan2(y2-y1,x2-x1),hl=12+(s.w||5)*2.2,r=function(v){return Math.round(v*10)/10};
    a.d="M"+x1+" "+y1+"L"+x2+" "+y2+"M"+r(x2-hl*Math.cos(an-.45))+" "+r(y2-hl*Math.sin(an-.45))+"L"+x2+" "+y2+"L"+r(x2-hl*Math.cos(an+.45))+" "+r(y2-hl*Math.sin(an+.45));
    return mk("path",a);
  }
  function drawStrokes(){
    sg.textContent="";
    Object.keys(strokes).forEach(function(k){var s=strokes[k];if(s&&s.p&&s.p.length>=2)sg.appendChild(strokeEl(s))});
  }
  function pt(e){
    var m=sv.getScreenCTM();if(!m)return{x:500,y:320};
    var p=sv.createSVGPoint();p.x=e.clientX;p.y=e.clientY;var q=p.matrixTransform(m.inverse());
    return{x:Math.max(30,Math.min(970,Math.round(q.x))),y:Math.max(25,Math.min(615,Math.round(q.y)))};
  }
  function nearest(p){
    var best=null,bd=85;
    ALL.forEach(function(id){
      if(!active(id))return;var t=tokens[id],d=Math.hypot(t.x-p.x,t.y-p.y)-(id==="ball"?10:0);
      if(d<bd){bd=d;best=id}
    });
    return best;
  }

  function updHist(){$("bUndo").disabled=!undo.length;$("bRedo").disabled=!redo.length}
  function pushHist(op){undo.push(op);if(undo.length>100)undo.shift();redo=[];updHist()}
  function clearHist(){undo=[];redo=[];updHist()}
  function setTok(id,pos){tokens[id]={x:pos.x,y:pos.y};place(id)}
  function doOp(op,dir){
    if(op.t==="mv")setTok(op.id,dir<0?op.from:op.to);
    else if(op.t==="tk"){var v=dir<0?op.b:op.a;ALL.forEach(function(id){tokens[id]={x:v[id].x,y:v[id].y}});placeAll()}
    else if(op.t==="add"){if(dir<0)delete strokes[op.id];else strokes[op.id]=op.d;drawStrokes()}
    else if(op.t==="clr"){Object.keys(op.items).forEach(function(k){if(dir<0)strokes[k]=op.items[k];else delete strokes[k]});drawStrokes()}
  }
  function stopPlay(){
    if(!playing)return;
    playing=false;cancelAnimationFrame(playRaf);tokens=backup;backup=null;placeAll();
    $("bPlay").textContent="Oynat";renderChips();
  }
  $("bUndo").onclick=function(){stopPlay();var op=undo.pop();if(!op)return;doOp(op,-1);redo.push(op);updHist()};
  $("bRedo").onclick=function(){stopPlay();var op=redo.pop();if(!op)return;doOp(op,1);undo.push(op);updHist()};

  sv.addEventListener("contextmenu",function(e){e.preventDefault()});
  sv.addEventListener("pointerdown",function(e){
    if(drag||cur||playing)return;
    var p=pt(e);
    if(tool==="move"){
      var id=nearest(p);if(!id)return;
      drag={id:id,dx:tokens[id].x-p.x,dy:tokens[id].y-p.y,from:{x:tokens[id].x,y:tokens[id].y}};
    }else{
      var sid=Date.now().toString(36)+Math.random().toString(36).slice(2,5);
      cur={id:sid,k:tool,c:color,w:wid,p:tool==="pen"?[p.x,p.y]:[p.x,p.y,p.x,p.y]};
      cur.el=strokeEl(cur);sg.appendChild(cur.el);
    }
    pid=e.pointerId;
    try{sv.setPointerCapture(e.pointerId)}catch(_){}
    e.preventDefault();
  });
  sv.addEventListener("pointermove",function(e){
    if(e.pointerId!==pid)return;
    var p=pt(e);
    if(drag){
      var t=tokens[drag.id];
      t.x=Math.max(30,Math.min(970,p.x+drag.dx));t.y=Math.max(25,Math.min(615,p.y+drag.dy));
      place(drag.id);
    }else if(cur){
      if(cur.k==="pen"){
        var L=cur.p.length;
        if(Math.abs(cur.p[L-2]-p.x)+Math.abs(cur.p[L-1]-p.y)>3&&L<1600){cur.p.push(p.x,p.y);cur.el.setAttribute("d",pathD(cur.p))}
      }else{
        cur.p[2]=p.x;cur.p[3]=p.y;
        var n=strokeEl(cur);if(cur.el.parentNode)cur.el.parentNode.replaceChild(n,cur.el);cur.el=n;
      }
    }
  });
  function up(e){
    if(e&&e.pointerId!==pid)return;
    if(drag){
      var tk=tokens[drag.id],moved=Math.hypot(tk.x-drag.from.x,tk.y-drag.from.y);
      if(moved>=6){pushHist({t:"mv",id:drag.id,from:drag.from,to:{x:tk.x,y:tk.y}})}
      else{tk.x=drag.from.x;tk.y=drag.from.y;place(drag.id);if(drag.id!=="ball")selectPlayer(drag.id)}
    }
    if(cur){
      var d=cur,good=true;
      if(d.k==="pen"){if(d.p.length<4)d.p.push(d.p[0]+1,d.p[1]+1)}
      else if(Math.hypot(d.p[2]-d.p[0],d.p[3]-d.p[1])<8)good=false;
      cur=null;
      if(good){var data={c:d.c,w:d.w,k:d.k,p:d.p.slice()};strokes[d.id]=data;drawStrokes();pushHist({t:"add",id:d.id,d:data})}
      else drawStrokes();
    }
    drag=null;cur=null;pid=null;
  }
  sv.addEventListener("pointerup",up);sv.addEventListener("pointercancel",up);

  function each(sel,fn){Array.prototype.forEach.call(document.querySelectorAll(sel),fn)}
  function setTool(t){tool=t;each(".tl",function(b){b.classList.toggle("on",b.getAttribute("data-t")===t)})}
  each(".tl",function(b){b.onclick=function(){setTool(b.getAttribute("data-t"))}});
  each(".wd",function(b){b.onclick=function(){wid=+b.getAttribute("data-w");each(".wd",function(x){x.classList.toggle("on",x===b)})}});
  each(".sw",function(b){
    b.onclick=function(){
      color=b.getAttribute("data-c");if(tool==="move")setTool("pen");
      each(".sw",function(x){x.classList.toggle("on",x===b)});
    };
  });
  function twoTap(btn,fn){
    var t=null,orig=btn.textContent;
    btn.onclick=function(){
      if(t){clearTimeout(t);t=null;btn.textContent=orig;btn.classList.remove("on");fn();return}
      btn.textContent="Emin misin?";btn.classList.add("on");
      t=setTimeout(function(){t=null;btn.textContent=orig;btn.classList.remove("on")},3000);
    };
  }
  twoTap($("bClear"),function(){
    var items=clone(strokes),ks=Object.keys(items);if(!ks.length)return;
    strokes={};drawStrokes();pushHist({t:"clr",items:items});
  });
  function setup(fn){
    stopPlay();var b=snap();fn();placeAll();updKo();
    pushHist({t:"tk",b:b,a:snap()});
  }
  twoTap($("bReset"),function(){setup(function(){resetForm(mode)})});
  $("bKick").onclick=function(){setup(function(){ko=(ko+1)%KO[mode].length;resetForm(mode)})};

  function applyMode(m){
    mode=m;
    each(".md",function(b){b.classList.toggle("on",+b.getAttribute("data-m")===m)});
    ALL.forEach(function(id){if(rows[id])rows[id].row.style.display=active(id)?"":"none"});
    placeAll();
  }
  each(".md",function(b){
    b.onclick=function(){
      var m=+b.getAttribute("data-m");if(m===mode)return;
      stopPlay();ko=0;resetForm(m);applyMode(m);updKo();clearHist();
    };
  });

  function renderChips(){
    var box=$("chips");box.textContent="";
    if(!frames.length){box.textContent="Henüz adım yok. Dizilimi kur, sonra Adım ekle düğmesine bas.";return}
    frames.forEach(function(f,i){
      var b=document.createElement("button");b.className="chip"+(i===fsel?" on":"");b.textContent=String(i+1);
      b.onclick=function(){
        if(playing)return;fsel=i;
        var bf=snap();ALL.forEach(function(id){if(f[id])tokens[id]={x:f[id].x,y:f[id].y}});placeAll();pushHist({t:"tk",b:bf,a:snap()});renderChips();
      };
      box.appendChild(b);
    });
  }
  $("bAdd").onclick=function(){if(playing)return;frames.push(snap());fsel=frames.length-1;renderChips()};
  $("bUpd").onclick=function(){if(playing||fsel<0||!frames[fsel])return;frames[fsel]=snap()};
  $("bDel").onclick=function(){
    if(playing||fsel<0||!frames[fsel])return;
    frames.splice(fsel,1);fsel=Math.min(fsel,frames.length-1);renderChips();
  };
  twoTap($("bFclr"),function(){stopPlay();frames=[];fsel=-1;renderChips()});
  $("bPlay").onclick=function(){
    if(playing){stopPlay();return}
    if(frames.length<2){status("Oynatmak için en az 2 adım ekle");return}
    playing=true;backup=clone(tokens);var seq=clone(frames);$("bPlay").textContent="Durdur";
    var seg=0,t0=performance.now(),DUR=1300,HOLD=350;
    function step(now){
      if(!playing)return;
      var el=Math.max(0,now-t0),a=seq[seg],b=seq[seg+1];
      var k=Math.min(1,el/DUR),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
      ALL.forEach(function(id){if(a[id]&&b[id]){tokens[id]={x:a[id].x+(b[id].x-a[id].x)*e,y:a[id].y+(b[id].y-a[id].y)*e};place(id)}});
      var cs=$("chips").children;for(var i=0;i<cs.length;i++)cs[i].classList.toggle("on",i===seg||i===seg+1&&k>.5);
      if(el>=DUR+HOLD){seg++;t0=now;if(seg>=seq.length-1){stopPlay();return}}
      playRaf=requestAnimationFrame(step);
    }
    playRaf=requestAnimationFrame(step);
  };

  function lib(){try{return JSON.parse(localStorage.getItem("rlTactics")||"[]")}catch(_){return []}}
  function setLib(a){try{localStorage.setItem("rlTactics",JSON.stringify(a));return true}catch(_){return false}}
  function loadTactic(s){
    stopPlay();clearHist();
    strokes={};drawStrokes();
    mode=FORM[s.mode]?s.mode:1;ko=s.ko||0;applyMode(mode);updKo();
    ALL.forEach(function(id){var t=s.tokens&&s.tokens[id];if(t)tokens[id]={x:t.x,y:t.y}});placeAll();
    labels=clone(s.labels||{});ALL.forEach(function(id){renderLabel(id);if(rows[id]){rows[id].nm.value=(labels[id]||{}).n||"";rows[id].rl.value=(labels[id]||{}).r||""}});reqRot();
    frames=clone(s.frames||[]);fsel=-1;renderChips();
    strokes=clone(s.strokes||{});drawStrokes();
  }
  function thumb(sv0){
    var m=FORM[sv0.mode]?sv0.mode:1,fr=sv0.frames||[],tk=sv0.tokens||{};
    var v=mk("svg",{viewBox:"0 0 1000 640"});
    v.appendChild(mk("rect",{width:1000,height:640,fill:"#070c1a"}));
    v.appendChild(mk("rect",{x:60,y:20,width:880,height:600,fill:"#0e2238",stroke:"#cfe0ff","stroke-opacity":.6,"stroke-width":3}));
    v.appendChild(mk("rect",{x:20,y:245,width:40,height:150,fill:"#2f7bff","fill-opacity":.5}));
    v.appendChild(mk("rect",{x:940,y:245,width:40,height:150,fill:"#ff8a1f","fill-opacity":.5}));
    v.appendChild(mk("line",{x1:500,y1:20,x2:500,y2:620,stroke:"#cfe0ff","stroke-opacity":.4,"stroke-width":3}));
    v.appendChild(mk("circle",{cx:500,cy:320,r:85,fill:"none",stroke:"#cfe0ff","stroke-opacity":.4,"stroke-width":3}));
    Object.keys(sv0.strokes||{}).forEach(function(k){var e=strokeEl(sv0.strokes[k]);if(e)v.appendChild(e)});
    function pos(f,id){var p=(f&&f[id])||tk[id]||{x:500,y:320};return p.x+" "+p.y}
    ALL.forEach(function(id){
      if(!FORM[m][id])return;
      var g=mk("g",{transform:"translate("+pos(tk,id)+")"});
      if(id==="ball")g.appendChild(mk("circle",{r:24,fill:"#fff"}));
      else g.appendChild(mk("rect",{x:-30,y:-19,width:60,height:38,rx:10,fill:id.charAt(0)==="b"?"#2f7bff":"#ff8a1f",stroke:"#fff","stroke-width":3}));
      v.appendChild(g);
    });
    return v;
  }
  function renderLib(){
    var box=$("lib"),a=lib();box.textContent="";
    if(!a.length){box.textContent="Kayıtlı taktik yok.";box.className="hint";return}
    box.className="";
    a.forEach(function(s,i){
      var r=document.createElement("div");r.className="lcard";
      r.appendChild(thumb(s));
      var bar=document.createElement("div");bar.className="lb2";
      var n=document.createElement("span");n.className="ln";n.textContent=s.name;
      var sm=document.createElement("small");var nf=(s.frames||[]).length,mm=FORM[s.mode]?s.mode:1;
      sm.textContent=(nf>=2?nf+" adım":"animasyon yok")+" · "+mm+"v"+mm;n.appendChild(sm);
      var l=document.createElement("button");l.textContent="Yükle";
      var d=document.createElement("button");d.textContent="Sil";d.className="ghost";
      bar.appendChild(n);bar.appendChild(l);bar.appendChild(d);r.appendChild(bar);box.appendChild(r);
      twoTap(l,function(){loadTactic(s)});
      twoTap(d,function(){var x=lib();x.splice(i,1);setLib(x);renderLib()});
    });
  }
  $("bSave").onclick=function(){
    var name=$("sname").value.trim();if(!name){status("Taktiğe bir isim ver");return}
    var a=lib().filter(function(s){return s.name!==name});
    a.unshift({name:name,mode:mode,ko:ko,tokens:snap(),labels:clone(labels),strokes:clone(strokes),frames:clone(frames)});
    if(setLib(a)){status(frames.length>=2?"Kaydedildi":"Kaydedildi (Animasyonsuz)");$("sname").value="";renderLib()}else status("Hafıza dolu");
  };
  $("bPng").onclick=function(){
    var c=sv.cloneNode(true);c.setAttribute("xmlns",NS);c.setAttribute("width",2000);c.setAttribute("height",1280);
    var url="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(new XMLSerializer().serializeToString(c));
    var img=new Image();
    img.onload=function(){
      var cv=document.createElement("canvas");cv.width=2000;cv.height=1280;cv.getContext("2d").drawImage(img,0,0,2000,1280);
      cv.toBlob(function(blob){
        if(!blob)return;
        var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="rltactic.png";a.click();
      },"image/png");
    };
    img.src=url;
  };

  applyMode(1);updKo();updHist();renderChips();renderLib();status("Hazır");
})();
</script>
</body>
</html>
