<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RLTactic</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:ital,wght@1,700&display=swap">
<style>
:root{--ink:#10162b;--mute:#5a6690;--night:#e9edf8;--panel:#ffffff;--panel2:#edf1fb;--line:#cdd5ec;--blue:#2f7bff;--orange:#ff8a1f;--bad:#d23c3c}
body{margin:0 auto;max-width:1180px;min-height:100vh;color:var(--ink);font:16px/1.45 "Barlow",system-ui,sans-serif;padding:12px;background:var(--night)}
.brand{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.logo{font:italic 700 24px/1 "Barlow Condensed",sans-serif}
.top-right{display:flex;align-items:center;gap:10px}
#st{font-size:13px;color:var(--mute);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 11px}
button,input{font:inherit;color:var(--ink);min-height:42px}
button{cursor:pointer;padding:8px 14px;border-radius:11px;border:1px solid var(--line);background:var(--panel)}
button:active{transform:scale(.97)}
input{padding:8px 12px;border-radius:11px;border:1px solid var(--line);background:var(--panel)}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:11px;min-height:38px;padding:6px 16px;font-weight:600}
.seg button.on{background:var(--blue);color:#fff}
.cta{border:0;color:#1c1204;font-weight:600;background:linear-gradient(100deg,#ffa43a,var(--orange));border-radius:14px;padding:8px 18px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.grp{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stage{border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#070c1a}
#sv{width:100%;height:auto;display:block;touch-action:none}
.layout{display:grid;gap:14px}
@media (min-width:900px){.layout{grid-template-columns:minmax(0,1fr) 310px;align-items:start}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px}
.panel h3{margin:0 0 8px;font:italic 700 19px/1 "Barlow Condensed",sans-serif}
.prow{display:grid;grid-template-columns:30px 1fr 1fr;gap:6px;align-items:center;margin-bottom:6px}
.prow input{min-height:36px;padding:4px 8px;font-size:14px}
.dot{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;color:#fff;font-weight:700;font-size:13px}
.dot.b{background:var(--blue)}.dot.o{background:var(--orange);color:#1c1204}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{min-height:38px;min-width:42px;padding:4px 10px;font-weight:700}
.chip.on{background:var(--blue);color:#fff}
.hint{color:var(--mute);font-size:14px}
.lang-btn{min-height:34px;padding:4px 12px;font-weight:700;font-size:13px;border-radius:999px;background:var(--panel2)}
</style>
</head>
<body>

<header class="brand">
  <span class="logo">RLTactic</span>
  <div class="top-right">
    <button id="bLang" class="lang-btn">TR / EN</button>
    <span id="st">Çevrimdışı Mod</span>
  </div>
</header>

<main id="app">
<div class="row">
  <div class="seg"><button class="md on" data-m="1">1v1</button><button class="md" data-m="2">2v2</button><button class="md" data-m="3">3v3</button></div>
  <button id="bKick" class="cta">Yeni kickoff</button>
</div>

<div class="layout">
<div class="main">
  <div class="stage">
    <svg id="sv" viewBox="0 0 1000 640">
      <defs>
        <linearGradient id="fl" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#0f3277"/><stop offset=".5" stop-color="#0b1a2e"/><stop offset="1" stop-color="#6e3611"/></linearGradient>
        <radialGradient id="haloB"><stop offset="0" stop-color="#2f7bff" stop-opacity=".55"/><stop offset="1" stop-color="#2f7bff" stop-opacity="0"/></radialGradient>
        <radialGradient id="haloO"><stop offset="0" stop-color="#ff8a1f" stop-opacity=".55"/><stop offset="1" stop-color="#ff8a1f" stop-opacity="0"/></radialGradient>
        <radialGradient id="haloW"><stop offset="0" stop-color="#fff" stop-opacity=".4"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
      </defs>
      <rect x="0" y="0" width="1000" height="640" fill="#070c1a"/>
      <rect x="60" y="20" width="880" height="600" fill="url(#fl)"/>
      <rect x="60" y="20" width="880" height="600" fill="none" stroke="#cfe0ff" stroke-opacity=".7" stroke-width="3"/>
      <line x1="500" y1="20" x2="500" y2="620" stroke="#cfe0ff" stroke-opacity=".5" stroke-width="2.5"/>
      <circle cx="500" cy="320" r="85" fill="none" stroke="#cfe0ff" stroke-opacity=".5" stroke-width="2.5"/>
      <g id="strokes" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></g>
      <g id="toks"></g>
    </svg>
  </div>

  <div class="panel">
    <div class="grp">
      <div class="seg">
        <button class="tl on" data-t="move">Taşı</button>
        <button class="tl" data-t="pen">Kalem</button>
      </div>
      <button id="bUndo" disabled>Geri al</button>
      <button id="bClear">Çizimleri sil</button>
      <button id="bReset">Dizilimi sıfırla</button>
    </div>
  </div>
</div>

<aside class="side">
  <div class="panel">
    <h3>Oyuncular</h3>
    <div id="plist"></div>
  </div>
  <div class="panel">
    <h3>Rotasyon</h3>
    <div class="tm"><span class="dot b"></span><span>Mavi takım</span></div><ol id="rotb"></ol>
    <div class="tm"><span class="dot o"></span><span>Turuncu takım</span></div><ol id="roto"></ol>
  </div>
</aside>
</div>
</main>

<script>
(function(){
  var mode = 1;
  var ALL = ["b1","b2","b3","o1","o2","o3","ball"];
  var FORM = {1:{b1:1,o1:1,ball:1}, 2:{b1:1,b2:1,o1:1,o2:1,ball:1}, 3:{b1:1,b2:1,b3:1,o1:1,o2:1,o3:1,ball:1}};
  var tokens = {
    b1:{x:280,y:170}, b2:{x:200,y:250}, b3:{x:150,y:320},
    o1:{x:720,y:470}, o2:{x:800,y:390}, o3:{x:850,y:320},
    ball:{x:500,y:320}
  };
  var labels = {}, rows = {};
  var $ = function(i){return document.getElementById(i)};
  var sv = $("sv"), tg = $("toks");
  var NS = "http://www.w3.org/2000/svg", els = {}, labG = {};

  function mk(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);return e}
  function active(id){return !!FORM[mode][id]}

  // Token'ları oluştur
  ALL.forEach(function(id){
    var g = mk("g",{class:"tok"});
    g.appendChild(mk("circle",{r:id==="ball"?38:46,fill:"url(#halo"+(id==="ball"?"W":id.charAt(0)==="b"?"B":"O")+")"}));
    if(id==="ball"){
      g.appendChild(mk("circle",{r:20,fill:"#fff",stroke:"#0a1226","stroke-width":3}));
    } else {
      g.appendChild(mk("rect",{x:-26,y:-16,width:52,height:32,rx:9,fill:id.charAt(0)==="b"?"#2f7bff":"#ff8a1f",stroke:"#fff","stroke-width":2.5}));
      var txt = mk("text",{y:6,"text-anchor":"middle",fill:"#fff","font-size":18,"font-weight":700});
      txt.textContent = id.charAt(1); g.appendChild(txt);
      var lb = mk("g",{}); g.appendChild(lb); labG[id] = lb;
    }
    g.setAttribute("data-id", id); tg.appendChild(g); els[id] = g;
  });

  function placeAll(){
    ALL.forEach(function(id){
      if(els[id]){
        els[id].setAttribute("transform","translate("+tokens[id].x+" "+tokens[id].y+")");
        els[id].style.display = active(id) ? "" : "none";
      }
    });
  }

  // Oyuncu paneli listesi
  ALL.forEach(function(id){
    if(id==="ball") return;
    var d = document.createElement("div"); d.className = "prow";
    d.id = "prow-" + id;
    var dot = document.createElement("span"); dot.className = "dot "+id.charAt(0); dot.textContent = id.charAt(1);
    var nm = document.createElement("input"); nm.placeholder = "İsim";
    var rl = document.createElement("input"); rl.placeholder = "Rol";
    d.appendChild(dot); d.appendChild(nm); d.appendChild(rl);
    $("plist").appendChild(d);
    rows[id] = {row: d, nm: nm, rl: rl};
    nm.oninput = function(){
      if(!labels[id]) labels[id] = {};
      labels[id].n = nm.value;
      updSide();
    };
  });

  function updPlayerVisibility(){
    ALL.forEach(function(id){
      if(rows[id]) rows[id].row.style.display = active(id) ? "" : "none";
    });
  }

  function updSide(){
    ["b","o"].forEach(function(tm){
      var ids = ALL.filter(function(i){return i.charAt(0)===tm && active(i)});
      var ul = $("rot"+tm); if(!ul) return; ul.textContent = "";
      ids.forEach(function(id){
        var L = labels[id] || {}, li = document.createElement("li");
        var txt = (L.n && L.n.trim()) ? L.n.trim() : (tm==="b"?"Mavi ":"Turuncu ") + id.charAt(1);
        li.textContent = txt; ul.appendChild(li);
      });
    });
  }

  // Mod değiştirme (1v1, 2v2, 3v3)
  document.querySelectorAll(".md").forEach(function(b){
    b.onclick = function(){
      mode = +b.getAttribute("data-m");
      document.querySelectorAll(".md").forEach(function(x){x.classList.toggle("on", x===b)});
      updPlayerVisibility();
      placeAll();
      updSide();
    };
  });

  // Sürükleme (Drag & Drop)
  var drag = null, pid = null;
  function pt(e){
    var m = sv.getScreenCTM(); if(!m) return {x:500,y:320};
    var p = sv.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
    var q = p.matrixTransform(m.inverse());
    return {x: Math.max(30, Math.min(970, Math.round(q.x))), y: Math.max(25, Math.min(615, Math.round(q.y)))};
  }

  sv.addEventListener("pointerdown", function(e){
    var p = pt(e);
    var best = null, bd = 85;
    ALL.forEach(function(id){
      if(!active(id)) return;
      var tPos = tokens[id], d = Math.hypot(tPos.x - p.x, tPos.y - p.y);
      if(d < bd){ bd = d; best = id; }
    });
    if(!best) return;
    drag = {id: best, dx: tokens[best].x - p.x, dy: tokens[best].y - p.y};
    pid = e.pointerId;
    try{ sv.setPointerCapture(pid); }catch(_){}
    e.preventDefault();
  });

  sv.addEventListener("pointermove", function(e){
    if(!drag || e.pointerId !== pid) return;
    var p = pt(e);
    tokens[drag.id].x = p.x + drag.dx;
    tokens[drag.id].y = p.y + drag.dy;
    placeAll();
  });

  function stopDrag(e){
    if(e && e.pointerId !== pid) return;
    drag = null; pid = null;
    updSide();
  }
  sv.addEventListener("pointerup", stopDrag);
  sv.addEventListener("pointercancel", stopDrag);

  // Başlangıç çalıştırmaları
  updPlayerVisibility();
  placeAll();
  updSide();
})();
</script>
</body>
</html>
