<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>RLTactic - Pro Esports Center</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:ital,wght@1,700&display=swap">
<style>
:root{--ink:#e9eefc;--mute:#9aa7cf;--night:#000000;--panel:#0B0B0C;--panel2:#141416;--line:#222226;--blue:#2f7bff;--orange:#ff8a1f;--accent:#C6F432;--bad:#d23c3c}
*{box-sizing:border-box}
html, body {
  background-color: #000000 !important;
  height: 100%;
  margin: 0;
  padding-bottom: 50px;
}
body{margin:0 auto;max-width:1240px;min-height:100vh;color:var(--ink);font:15px/1.45 "Barlow",system-ui,sans-serif;padding:10px;background:var(--night);-webkit-user-select:none;user-select:none}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.logo{font:italic 700 24px/1 "Barlow Condensed",sans-serif; color:#fff; display:flex; align-items:center; gap:8px;}
.logo span{background:var(--accent);color:#0B0B0C;font-size:12px;padding:2px 6px;border-radius:6px;font-style:normal;}
.top-right{display:flex;align-items:center;gap:8px}
button,input,select{font:inherit;color:var(--ink);min-height:42px}
button{cursor:pointer;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);transition:transform .08s}
button:active{transform:scale(.97)}
button:focus, input:focus, select:focus{outline:none!important}
input, select{padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);width:100%}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:11px;min-height:38px;padding:6px 14px;font-weight:600}
.seg button.on{background:var(--accent);color:#0B0B0C}
.cta{border:0;color:#0B0B0C;font-weight:700;background:var(--accent);border-radius:14px;padding:8px 16px}
.ghost.on{background:var(--bad);border-color:var(--bad);color:#fff}
.sw{width:34px;height:34px;min-height:0;padding:0;border-radius:50%;border:2px solid var(--line)}
.sw.on{box-shadow:0 0 0 2px var(--night),0 0 0 4px var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.grp{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stage{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#000000;position:relative}
#cvs{width:100%;height:auto;display:block;touch-action:none;aspect-ratio:1000/640;}
.layout{display:flex;flex-direction:column;gap:12px}
@media (min-width:980px){.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;align-items:start}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.panel h3{margin:0 0 8px;font:italic 700 18px/1 "Barlow Condensed",sans-serif;display:flex;justify-content:space-between;align-items:center}
.prow{display:grid;grid-template-columns:30px 1fr 1fr;gap:6px;align-items:center;margin-bottom:6px}
.prow input{min-height:38px;padding:4px 8px;font-size:14px}
.dot{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;color:#fff;font-weight:700;font-size:13px}
.dot.b{background:var(--blue)}.dot.o{background:var(--orange);color:#1c1204}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{min-height:38px;min-width:42px;padding:4px 10px;font-weight:700}
.chip.on{background:var(--accent);color:#0B0B0C}
.hint{color:var(--mute);font-size:14px}
.save{display:flex;gap:6px;margin-bottom:6px}
.save input{flex:1;min-width:0}
.lcard{margin-top:10px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel2)}
.lcard canvas{display:block;width:100%;height:auto}
.lcard .lb2{display:flex;gap:6px;align-items:center;padding:8px}
.lcard .ln{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:14px}
.lcard small{display:block;color:var(--mute);font-weight:400;font-size:12px}
.lcard button{min-height:34px;padding:4px 10px;font-size:13px}
.top-btn{min-height:34px;padding:4px 12px;font-weight:700;font-size:13px;border-radius:999px;background:var(--panel2)}
#bDownloadApp { background: var(--accent); color:#0B0B0C; border:0; font-weight:700; }
</style>
</head>
<body>

<header>
  <span class="logo">RLTactic <span>PRO AI</span></span>
  <div class="top-right">
    <button id="bDownloadApp" class="top-btn">📥 Yükle</button>
    <button id="bLang" class="top-btn">TR / EN</button>
  </div>
</header>

<main id="app">
<div class="row">
  <div class="seg" role="group"><button class="md on" data-m="1">1v1</button><button class="md" data-m="2">2v2</button><button class="md" data-m="3">3v3</button></div>
  <div class="grp">
    <button id="bKick" class="cta" data-i18n="kickoff">Yeni kickoff</button>
  </div>
</div>

<div class="layout">
<div class="main">
  <div class="stage">
    <canvas id="cvs" width="1000" height="640"></canvas>
  </div>

  <div class="panel" style="margin-top:10px">
    <div class="grp" style="margin-bottom:8px">
      <div class="seg">
        <button class="tl on" data-t="move" data-i18n="tl_move">Taşı</button>
        <button class="tl" data-t="pen" data-i18n="tl_pen">Kalem</button>
        <button class="tl" data-t="arrow" data-i18n="tl_arrow">Ok</button>
        <button class="tl" data-t="rect" data-i18n="tl_rect">Kare</button>
      </div>
    </div>
    <div class="grp">
      <div class="seg">
        <button class="wd" data-w="3" data-i18n="wd_thin">İnce</button>
        <button class="wd on" data-w="5" data-i18n="wd_mid">Orta</button>
        <button class="wd" data-w="9" data-i18n="wd_thick">Kalın</button>
      </div>
      <div style="display:flex;gap:6px;align-items:center">
        <button class="sw on" data-c="#ffffff" style="background:#fff"></button>
        <button class="sw" data-c="#ffd400" style="background:#ffd400"></button>
        <button class="sw" data-c="#00e5ff" style="background:#00e5ff"></button>
        <button class="sw" data-c="#ff5ca8" style="background:#ff5ca8"></button>
      </div>
      <button id="bUndo" data-i18n="btn_undo" disabled>Geri al</button>
      <button id="bClear" class="ghost" data-i18n="btn_clear">Temizle</button>
      <button id="bReset" class="ghost" data-i18n="btn_reset">Sıfırla</button>
    </div>
  </div>

  <!-- AI ANALİZ PANELİ -->
  <div class="panel">
    <h3>🤖 Pro AI Taktik Motoru</h3>
    <div id="aiReport" style="background:var(--panel2);padding:14px;border-radius:12px;border:1px solid var(--line);font-size:14px;line-height:1.5;">
      Pozisyon taranıyor...
    </div>
    <button id="bRunAi" class="cta" style="margin-top:10px;width:100%;">Detaylı AI Analizi Çalıştır</button>
  </div>

  <div class="panel">
    <h3 data-i18n="h_anim">Animasyon</h3>
    <div class="grp">
      <button id="bAdd" data-i18n="btn_add">Adım ekle</button>
      <button id="bUpd" data-i18n="btn_upd">Güncelle</button>
      <button id="bDel" data-i18n="btn_del">Adım sil</button>
      <button id="bPlay" class="cta" data-i18n="btn_play">Oynat</button>
      <button id="bGif" data-i18n="b_gif">GIF</button>
      <button id="bFclr" class="ghost" data-i18n="btn_fclr">Hepsini sil</button>
    </div>
    <div class="chips" id="chips"></div>
  </div>
</div>

<aside class="side">
  <div class="panel">
    <h3 data-i18n="h_players">Oyuncular</h3>
    <div id="plist"></div>
  </div>
  <div class="panel">
    <h3 data-i18n="h_rotation">Rotasyon</h3>
    <div class="tm" style="font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px"><span class="dot b"></span> <span data-i18n="tm_blue">Mavi takım</span></div><ol id="rotb" style="margin:4px 0 8px 20px;font-size:13px"></ol>
    <div class="tm" style="font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px"><span class="dot o"></span> <span data-i18n="tm_orange">Turuncu takım</span></div><ol id="roto" style="margin:4px 0 0 20px;font-size:13px"></ol>
  </div>
  <div class="panel">
    <h3 data-i18n="h_saved">Kayıtlı Taktikler</h3>
    <div class="save"><input id="sname" maxlength="30" data-i18n-ph="ph_name" placeholder="Taktik adı"><button id="bSave" data-i18n="btn_save">Kaydet</button></div>
    <div class="save"><input id="tcode" maxlength="400" placeholder="Taktik kodu yapıştır"><button id="bLoadCode" class="ghost">Kodu Yükle</button></div>
    <div id="lib"></div>
  </div>
  <div class="panel">
    <h3 data-i18n="h_export">Dışa Aktar</h3>
    <button id="bPng" style="width:100%" data-i18n="btn_png">PNG İndir</button>
  </div>
</aside>
</div>
</main>
<datalist id="roles"></datalist>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('./sw.js').catch(function(err) {});
  });
}

if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
  var dlBtn = document.getElementById('bDownloadApp');
  if (dlBtn) dlBtn.style.display = 'none';
}

let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
});

document.getElementById('bDownloadApp')?.addEventListener('click', async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
  } else {
    alert("Uygulamayı kurmak için tarayıcı menüsünden 'Ana Ekrana Ekle' seçeneğini kullanın.");
  }
});

(function(){
  var dict = {
    tr: {
      kickoff: "Yeni kickoff",
      tl_move: "Taşı", tl_pen: "Kalem", tl_arrow: "Ok", tl_rect: "Kare",
      wd_thin: "İnce", wd_mid: "Orta", wd_thick: "Kalın",
      btn_undo: "Geri al", btn_clear: "Temizle", btn_reset: "Sıfırla",
      h_anim: "Animasyon", btn_add: "Adım ekle", btn_upd: "Güncelle", btn_del: "Adım sil",
      btn_play: "Oynat", btn_stop: "Durdur", b_gif: "GIF", btn_fclr: "Hepsini sil",
      h_players: "Oyuncular", h_rotation: "Rotasyon", tm_blue: "Mavi takım", tm_orange: "Turuncu takım",
      h_saved: "Kayıtlı Taktikler", ph_name: "Taktik adı", btn_save: "Kaydet",
      h_export: "Dışa Aktar", btn_png: "PNG İndir",
      no_steps: "Henüz adım yok.", no_tactics: "Kayıtlı taktik yok.",
      near_ball: "Topa En Yakın", near_net: "Kaleye En Yakın",
      blue_def: "Mavi ", orange_def: "Turuncu ",
      roles: ["First Man", "Second Man", "Last Man", "Rotasyoncu", "Destek", "Kaleci"]
    },
    en: {
      kickoff: "New Kickoff",
      tl_move: "Move", tl_pen: "Pen", tl_arrow: "Arrow", tl_rect: "Square",
      wd_thin: "Thin", wd_mid: "Mid", wd_thick: "Thick",
      btn_undo: "Undo", btn_clear: "Clear", btn_reset: "Reset",
      h_anim: "Animation", btn_add: "Add Step", btn_upd: "Update", btn_del: "Delete Step",
      btn_play: "Play", btn_stop: "Stop", b_gif: "GIF", btn_fclr: "Clear All",
      h_players: "Players", h_rotation: "Rotation", tm_blue: "Blue Team", tm_orange: "Orange Team",
      h_saved: "Saved Tactics", ph_name: "Tactic Name", btn_save: "Save",
      h_export: "Export", btn_png: "Download PNG",
      no_steps: "No steps yet.", no_tactics: "No saved tactics.",
      near_ball: "Closest to Ball", near_net: "Closest to Net",
      blue_def: "Blue ", orange_def: "Orange ",
      roles: ["First Man", "Second Man", "Last Man", "Rotator", "Support", "Goalkeeper"]
    }
  };

  var curLang = localStorage.getItem("rltactic_lang") || "tr";
  function t(key){ return (dict[curLang] && dict[curLang][key]) ? dict[curLang][key] : key; }

  var FORM = {1:{b1:1,o1:1,ball:1}, 2:{b1:1,b2:1,o1:1,o2:1,ball:1}, 3:{b1:1,b2:1,b3:1,o1:1,o2:1,o3:1,ball:1}};
  var ALL = ["b1","b2","b3","o1","o2","o3","ball"];
  var SPOTS = [[280,170],[280,470],[170,301],[170,339],[104,320]];
  var KO = {1:[[0],[1],[2],[3],[4]], 2:[[0,1],[2,3],[0,4],[1,4],[0,3]], 3:[[0,1,4],[2,3,4],[0,3,4],[2,1,4],[0,1,2]]};

  var savedState = null;
  try { savedState = JSON.parse(localStorage.getItem("rltactic_state")); } catch(_) {}

  var mode = (savedState && savedState.mode) ? savedState.mode : 1;
  var ko = (savedState && typeof savedState.ko === "number") ? savedState.ko : 0;
  var tokens = (savedState && savedState.tokens) ? savedState.tokens : {};
  var labels = (savedState && savedState.labels) ? savedState.labels : {};
  var strokes = (savedState && savedState.strokes) ? savedState.strokes : {};
  var frames = (savedState && savedState.frames) ? savedState.frames : [];
  var fsel = -1, tool = "move", color = "#ffffff", wid = 5;
  var drag = null, cur = null, pid = null;
  var playing = false, backup = null, playRaf = 0, undo = [], redo = [], rotQ = 0;

  var $ = function(i){return document.getElementById(i)};
  var cvs = $("cvs"), ctx = cvs.getContext("2d");
  var rows = {};

  function saveState(){
    try {
      localStorage.setItem("rltactic_state", JSON.stringify({
        mode: mode, ko: ko, tokens: tokens, labels: labels, strokes: strokes, frames: frames
      }));
    } catch(_) {}
  }

  function active(id){return !!FORM[mode][id]}
  function clone(o){return JSON.parse(JSON.stringify(o))}
  function snap(){var o={};ALL.forEach(function(id){o[id]={x:tokens[id].x,y:tokens[id].y}});return o}

  function resetForm(m){
    var set = KO[m][ko%KO[m].length];
    ALL.forEach(function(id){if(!tokens[id]) tokens[id]={x:500,y:320}});
    for(var i=0; i<m; i++){
      var s = SPOTS[set[i]];
      tokens["b"+(i+1)] = {x:s[0], y:s[1]};
      tokens["o"+(i+1)] = {x:1000-s[0], y:640-s[1]};
    }
    tokens["ball"] = {x:500, y:320};
  }
  if(!savedState || !Object.keys(tokens).length) resetForm(mode);

  function updKo(){
    var n = KO[mode].length;
    var btn = $("bKick");
    if(btn) btn.textContent = t("kickoff") + " (" + ((ko%n)+1) + "/" + n + ")";
  }

  ALL.forEach(function(id){
    if(id==="ball") return;
    var d = document.createElement("div"); d.className = "prow";
    var dot = document.createElement("span"); dot.className = "dot "+id.charAt(0); dot.textContent = id.charAt(1);
    var nm = document.createElement("input"); nm.className = "nm"; nm.placeholder = curLang==="tr"?"İsim":"Name"; nm.maxLength = 14;
    var rl = document.createElement("input"); rl.className = "rl"; rl.placeholder = curLang==="tr"?"Rol":"Role"; rl.maxLength = 18;
    if(labels[id]){
      if(labels[id].n) nm.value = labels[id].n;
      if(labels[id].r) rl.value = labels[id].r;
    }
    d.appendChild(dot); d.appendChild(nm); d.appendChild(rl);
    $("plist").appendChild(d);
    rows[id] = {row: d, nm: nm, rl: rl};
    function ch(){
      if(!labels[id]) labels[id] = {};
      labels[id].n = nm.value; labels[id].r = rl.value;
      reqRot(); saveState(); draw();
    }
    nm.oninput = ch; rl.oninput = ch;
  });

  function updPlayerRowsVisibility(){
    ALL.forEach(function(id){
      if(rows[id]) rows[id].row.style.display = active(id) ? "" : "none";
    });
  }

  function dist(id){
    var a = tokens[id], b = tokens.ball;
    return Math.hypot(a.x-b.x, a.y-b.y);
  }

  function reqRot(){
    if(rotQ) return;
    rotQ = requestAnimationFrame(function(){ rotQ = 0; updSide(); });
  }

  function updSide(){
    ["b","o"].forEach(function(tm){
      var activeIds = [];
      for(var i=1; i<=mode; i++){ activeIds.push(tm + i); }
      activeIds.sort(function(a,c){ return dist(a)-dist(c); });

      var own = activeIds.slice().sort(function(a,c){
        return tm==="b" ? tokens[a].x - tokens[c].x : tokens[c].x - tokens[a].x;
      })[0];

      var ul = $("rot"+tm); if(!ul) return; ul.textContent = "";
      activeIds.forEach(function(id,i){
        var L = labels[id] || {}, li = document.createElement("li");
        var txt = (L.n && L.n.trim()) ? L.n.trim() : (tm==="b"?t("blue_def"):t("orange_def")) + id.charAt(1);
        if(L.r && L.r.trim()) txt += " · " + L.r.trim();
        var tag = [];
        if(i===0) tag.push(t("near_ball"));
        if(id===own && activeIds.length>1) tag.push(t("near_net"));
        if(tag.length) txt += " (" + tag.join(", ") + ")";
        li.textContent = txt; ul.appendChild(li);
      });
    });
  }

  function drawRoundedRect(c, x, y, w, h, r){
    c.beginPath();
    c.moveTo(x+r, y);
    c.lineTo(x+w-r, y);
    c.quadraticCurveTo(x+w, y, x+w, y+r);
    c.lineTo(x+w, y+h-r);
    c.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
    c.lineTo(x+r, y+h);
    c.quadraticCurveTo(x, y+h, x, y+h-r);
    c.lineTo(x, y+r);
    c.quadraticCurveTo(x, y, x+r, y);
    c.closePath();
  }

  function drawField(c){
    c.fillStyle = "#000000";
    c.fillRect(0, 0, 1000, 640);

    c.strokeStyle = "#162235";
    c.lineWidth = 14;
    c.globalAlpha = 0.55;
    drawRoundedRect(c, 30, 8, 940, 624, 60);
    c.stroke();
    c.globalAlpha = 1.0;

    var grad = c.createLinearGradient(0, 20, 0, 620);
    grad.addColorStop(0, "#12301f");
    grad.addColorStop(1, "#07170e");
    c.fillStyle = grad;
    drawRoundedRect(c, 60, 20, 880, 600, 65);
    c.fill();
    c.strokeStyle = "#1f3b2a";
    c.lineWidth = 3.5;
    c.stroke();

    c.fillStyle = "rgba(255, 255, 255, 0.035)";
    for(var x = 110; x < 940; x += 100){
      c.fillRect(x, 20, 50, 600);
    }

    c.fillStyle = "rgba(47, 123, 255, 0.18)";
    c.beginPath();
    c.moveTo(60, 210);
    c.bezierCurveTo(180, 210, 180, 430, 60, 430);
    c.fill();

    c.fillStyle = "rgba(255, 138, 31, 0.18)";
    c.beginPath();
    c.moveTo(940, 210);
    c.bezierCurveTo(820, 210, 820, 430, 940, 430);
    c.fill();

    c.fillStyle = "#0a1324";
    c.strokeStyle = "#2f7bff";
    c.lineWidth = 3.5;
    drawRoundedRect(c, 10, 240, 50, 160, 6);
    c.fill(); c.stroke();

    c.strokeStyle = "rgba(47, 123, 255, 0.6)";
    c.lineWidth = 2;
    c.setLineDash([4, 4]);
    c.beginPath(); c.moveTo(10, 260); c.lineTo(0, 260); c.lineTo(0, 380); c.lineTo(10, 380); c.stroke();
    c.setLineDash([]);

    c.fillStyle = "#24130a";
    c.strokeStyle = "#ff8a1f";
    c.lineWidth = 3.5;
    drawRoundedRect(c, 940, 240, 50, 160, 6);
    c.fill(); c.stroke();

    c.strokeStyle = "rgba(255, 138, 31, 0.6)";
    c.lineWidth = 2;
    c.setLineDash([4, 4]);
    c.beginPath(); c.moveTo(990, 260); c.lineTo(1000, 260); c.lineTo(1000, 380); c.lineTo(990, 380); c.stroke();
    c.setLineDash([]);

    c.strokeStyle = "rgba(255, 255, 255, 0.9)";
    c.lineWidth = 3.5;
    drawRoundedRect(c, 60, 20, 880, 600, 65);
    c.stroke();

    c.beginPath();
    c.moveTo(500, 20); c.lineTo(500, 620);
    c.stroke();

    c.beginPath();
    c.arc(500, 320, 95, 0, Math.PI * 2);
    c.stroke();

    c.fillStyle = "rgba(255, 255, 255, 0.95)";
    c.beginPath();
    c.arc(500, 320, 6, 0, Math.PI * 2);
    c.fill();

    var boosts = [
      {x: 105, y: 72, r: 11, big: true}, 
      {x: 895, y: 72, r: 11, big: true},
      {x: 105, y: 568, r: 11, big: true}, 
      {x: 895, y: 568, r: 11, big: true},
      {x: 350, y: 85, r: 8, big: false},
      {x: 650, y: 85, r: 8, big: false},
      {x: 350, y: 555, r: 8, big: false},
      {x: 650, y: 555, r: 8, big: false},
      {x: 300, y: 320, r: 8, big: false},
      {x: 700, y: 320, r: 8, big: false}
    ];

    boosts.forEach(function(b){
      c.fillStyle = b.big ? "rgba(198, 244, 50, 0.28)" : "rgba(198, 244, 50, 0.16)";
      c.strokeStyle = "#C6F432";
      c.lineWidth = b.big ? 2.2 : 1.5;
      c.beginPath(); 
      c.arc(b.x, b.y, b.r, 0, Math.PI*2); 
      c.fill(); 
      c.stroke();
    });
  }

  function drawStroke(s){
    if(!s || !s.p || s.p.length < 2) return;
    ctx.strokeStyle = s.c || "#fff";
    ctx.lineWidth = s.w || 5;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    var p = s.p;
    if(s.k === "pen"){
      ctx.beginPath(); ctx.moveTo(p[0], p[1]);
      for(var i=2; i<p.length; i+=2) ctx.lineTo(p[i], p[i+1]);
      ctx.stroke();
    } else {
      var x1 = p[0], y1 = p[1], x2 = p[2] !== undefined ? p[2] : x1, y2 = p[3] !== undefined ? p[3] : y1;
      if(s.k === "rect"){
        ctx.strokeRect(Math.min(x1,x2), Math.min(y1,y2), Math.abs(x2-x1), Math.abs(y2-y1));
      } else if(s.k === "circle"){
        var r = Math.hypot(x2-x1, y2-y1);
        ctx.beginPath(); ctx.arc(x1, y1, r, 0, Math.PI*2); ctx.stroke();
      } else if(s.k === "arrow"){
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
        var an = Math.atan2(y2-y1, x2-x1), hl = 12 + (s.w||5)*2.2;
        ctx.beginPath();
        ctx.moveTo(x2 - hl * Math.cos(an - 0.45), y2 - hl * Math.sin(an - 0.45));
        ctx.lineTo(x2, y2);
        ctx.lineTo(x2 - hl * Math.cos(an + 0.45), y2 - hl * Math.sin(an + 0.45));
        ctx.stroke();
      }
    }
  }

  function drawTokens(){
    ALL.forEach(function(id){
      if(!active(id)) return;
      var pos = tokens[id]; if(!pos) return;
      ctx.save();
      ctx.translate(pos.x, pos.y);

      var grad = ctx.createRadialGradient(0, 0, 10, 0, 0, id==="ball"?38:46);
      if(id==="ball"){
        grad.addColorStop(0, "rgba(255,255,255,0.5)"); grad.addColorStop(1, "rgba(255,255,255,0)");
      } else if(id.charAt(0)==="b"){
        grad.addColorStop(0, "rgba(47,123,255,0.5)"); grad.addColorStop(1, "rgba(47,123,255,0)");
      } else {
        grad.addColorStop(0, "rgba(255,138,31,0.5)"); grad.addColorStop(1, "rgba(255,138,31,0)");
      }
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(0, 0, id==="ball"?38:46, 0, Math.PI*2); ctx.fill();

      if(id==="ball"){
        ctx.fillStyle = "#ffffff";
        ctx.strokeStyle = "#0a1226";
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI*2); ctx.fill(); ctx.stroke();
      } else {
        ctx.fillStyle = id.charAt(0)==="b" ? "#2f7bff" : "#ff8a1f";
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2.5;
        drawRoundedRect(ctx, -26, -16, 52, 32, 9);
        ctx.fill(); ctx.stroke();

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 18px Barlow, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(id.charAt(1), 0, 1);

        var L = labels[id] || {}, n = (L.n || "").trim(), r = (L.r || "").trim();
        if(n || r){
          var w = Math.max(n.length*8.4, r.length*6.8)+18, h = (n&&r)?36:22;
          ctx.fillStyle = "rgba(0,0,0,0.85)";
          ctx.strokeStyle = id.charAt(0)==="b" ? "#2f7bff" : "#ff8a1f";
          ctx.lineWidth = 1.5;
          drawRoundedRect(ctx, -w/2, 24, w, h, 8);
          ctx.fill(); ctx.stroke();

          ctx.textAlign = "center";
          if(n){
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 14px Barlow, sans-serif";
            ctx.fillText(n, 0, r ? 39 : 35);
          }
          if(r){
            ctx.fillStyle = "#cfe0ff";
            ctx.font = "11px Barlow, sans-serif";
            ctx.fillText(r, 0, n ? 52 : 35);
          }
        }
      }
      ctx.restore();
    });
  }

  function draw(){
    drawField(ctx);
    Object.keys(strokes).forEach(function(k){ drawStroke(strokes[k]); });
    if(cur) drawStroke(cur);
    drawTokens();
    reqRot();
  }

  function pt(e){
    var rect = cvs.getBoundingClientRect();
    var scaleX = cvs.width / rect.width;
    var scaleY = cvs.height / rect.height;
    var x = (e.clientX - rect.left) * scaleX;
    var y = (e.clientY - rect.top) * scaleY;
    return {
      x: Math.max(30, Math.min(970, Math.round(x))),
      y: Math.max(25, Math.min(615, Math.round(y)))
    };
  }

  function nearest(p){
    var best = null, bd = 85;
    ALL.forEach(function(id){
      if(!active(id)) return;
      var tPos = tokens[id], d = Math.hypot(tPos.x-p.x, tPos.y-p.y) - (id==="ball"?10:0);
      if(d < bd){ bd = d; best = id; }
    });
    return best;
  }

  function updHist(){
    if($("bUndo")) $("bUndo").disabled = !undo.length;
  }
  function pushHist(op){
    undo.push(op); if(undo.length>100) undo.shift();
    redo = []; updHist();
  }
  function clearHist(){undo = []; redo = []; updHist();}

  function setTok(id, pos){
    tokens[id] = {x:pos.x, y:pos.y}; saveState(); draw();
  }

  function doOp(op, dir){
    if(op.t==="mv") setTok(op.id, dir<0?op.from:op.to);
    else if(op.t==="tk"){
      var v = dir<0?op.b:op.a;
      ALL.forEach(function(id){ tokens[id] = {x:v[id].x, y:v[id].y}; });
      saveState(); draw();
    } else if(op.t==="add"){
      if(dir<0) delete strokes[op.id]; else strokes[op.id] = op.d;
      saveState(); draw();
    } else if(op.t==="clr"){
      Object.keys(op.items).forEach(function(k){
        if(dir<0) strokes[k] = op.items[k]; else delete strokes[k];
      });
      saveState(); draw();
    }
  }

  function stopPlay(){
    if(!playing) return;
    playing = false; cancelAnimationFrame(playRaf);
    tokens = backup; backup = null; draw();
    if($("bPlay")) $("bPlay").textContent = t("btn_play");
    renderChips();
  }

  if($("bUndo")) $("bUndo").onclick = function(){
    stopPlay(); var op = undo.pop(); if(!op) return;
    doOp(op, -1); redo.push(op); updHist();
  };

  if(cvs){
    cvs.addEventListener("contextmenu", function(e){e.preventDefault()});
    cvs.addEventListener("pointerdown", function(e){
      if(drag || cur || playing) return;
      var p = pt(e);
      if(tool==="move"){
        var id = nearest(p); if(!id) return;
        drag = {id:id, dx:tokens[id].x-p.x, dy:tokens[id].y-p.y, from:{x:tokens[id].x, y:tokens[id].y}};
      } else {
        var sid = Date.now().toString(36) + Math.random().toString(36).slice(2,5);
        cur = {id:sid, k:tool, c:color, w:wid, p:tool==="pen"?[p.x,p.y]:[p.x,p.y,p.x,p.y]};
      }
      pid = e.pointerId;
      try{ cvs.setPointerCapture(pid); }catch(_){}
      e.preventDefault();
    });

    cvs.addEventListener("pointermove", function(e){
      if(e.pointerId!==pid) return;
      var p = pt(e);
      if(drag){
        var tPos = tokens[drag.id];
        tPos.x = Math.max(30, Math.min(970, p.x+drag.dx));
        tPos.y = Math.max(25, Math.min(615, p.y+drag.dy));
        draw();
      } else if(cur){
        if(cur.k==="pen"){
          var L = cur.p.length;
          if(Math.abs(cur.p[L-2]-p.x)+Math.abs(cur.p[L-1]-p.y)>3 && L<1600){
            cur.p.push(p.x, p.y);
          }
        } else {
          cur.p[2] = p.x; cur.p[3] = p.y;
        }
        draw();
      }
    });

    function up(e){
      if(e && e.pointerId!==pid) return;
      if(drag){
        var tk = tokens[drag.id], moved = Math.hypot(tk.x-drag.from.x, tk.y-drag.from.y);
        if(moved>=6){
          pushHist({t:"mv", id:drag.id, from:drag.from, to:{x:tk.x, y:tk.y}});
          saveState();
        } else {
          tk.x = drag.from.x; tk.y = drag.from.y; draw();
        }
      }
      if(cur){
        var d = cur, good = true;
        if(d.k==="pen"){ if(d.p.length<4) d.p.push(d.p[0]+1, d.p[1]+1); }
        else if(Math.hypot(d.p[2]-d.p[0], d.p[3]-d.p[1])<8) good = false;
        cur = null;
        if(good){
          var data = {c:d.c, w:d.w, k:d.k, p:d.p.slice()};
          strokes[d.id] = data;
          pushHist({t:"add", id:d.id, d:data}); saveState();
        }
        draw();
      }
      drag = null; cur = null; pid = null;
    }
    cvs.addEventListener("pointerup", up);
    cvs.addEventListener("pointercancel", up);
  }

  function each(sel, fn){document.querySelectorAll(sel).forEach(fn)}

  function setTool(tTool){
    tool = tTool;
    each(".tl", function(b){ b.classList.toggle("on", b.getAttribute("data-t")===tTool); });
  }

  each(".tl", function(b){ b.onclick = function(){ setTool(b.getAttribute("data-t")); }; });
  each(".wd", function(b){
    b.onclick = function(){
      wid = +b.getAttribute("data-w");
      each(".wd", function(x){ x.classList.toggle("on", x===b); });
    };
  });
  each(".sw", function(b){
    b.onclick = function(){
      color = b.getAttribute("data-c");
      if(tool==="move") setTool("pen");
      each(".sw", function(x){ x.classList.toggle("on", x===b); });
    };
  });

  function twoTap(btn, fn){
    if(!btn) return;
    var timer = null;
    btn.onclick = function(){
      if(timer){ clearTimeout(timer); timer = null; btn.textContent = btn._origText; btn.classList.remove("on"); fn(); return; }
      btn._origText = btn.textContent;
      btn.textContent = curLang==="tr"?"Emin misin?":"Sure?";
      btn.classList.add("on");
      timer = setTimeout(function(){ timer = null; btn.textContent = btn._origText; btn.classList.remove("on"); }, 3000);
    };
  }

  twoTap($("bClear"), function(){
    var items = clone(strokes); if(!Object.keys(items).length) return;
    strokes = {}; draw(); pushHist({t:"clr", items:items}); saveState();
  });

  function setup(fn){
    stopPlay(); var b = snap(); fn(); draw(); updKo();
    pushHist({t:"tk", b:b, a:snap()}); saveState();
  }

  twoTap($("bReset"), function(){ setup(function(){ resetForm(mode); }); });
  if($("bKick")) $("bKick").onclick = function(){
    setup(function(){ ko = (ko + 1) % KO[mode].length; resetForm(mode); });
  };

  function applyMode(m){
    mode = m;
    each(".md", function(b){ b.classList.toggle("on", +b.getAttribute("data-m")===m); });
    updPlayerRowsVisibility();
    draw();
    saveState();
  }

  each(".md", function(b){
    b.onclick = function(){
      var m = +b.getAttribute("data-m"); if(m===mode) return;
      stopPlay(); ko = 0; resetForm(m); applyMode(m); updKo(); clearHist();
    };
  });

  function renderChips(){
    var box = $("chips"); if(!box) return; box.textContent = "";
    if(!frames.length){ box.textContent = t("no_steps"); return; }
    frames.forEach(function(f, i){
      var b = document.createElement("button"); b.className = "chip" + (i===fsel?" on":""); b.textContent = String(i+1);
      b.onclick = function(){
        if(playing) return; fsel = i;
        var bf = snap();
        ALL.forEach(function(id){ if(f[id]) tokens[id] = {x:f[id].x, y:f[id].y}; });
        draw(); pushHist({t:"tk", b:bf, a:snap()}); renderChips(); saveState();
      };
      box.appendChild(b);
    });
  }

  if($("bAdd")) $("bAdd").onclick = function(){ if(playing) return; frames.push(snap()); fsel = frames.length-1; renderChips(); saveState(); };
  if($("bUpd")) $("bUpd").onclick = function(){ if(playing || fsel<0 || !frames[fsel]) return; frames[fsel] = snap(); saveState(); };
  if($("bDel")) $("bDel").onclick = function(){
    if(playing || fsel<0 || !frames[fsel]) return;
    frames.splice(fsel, 1); fsel = Math.min(fsel, frames.length-1); renderChips(); saveState();
  };
  twoTap($("bFclr"), function(){ stopPlay(); frames = []; fsel = -1; renderChips(); saveState(); });

  if($("bPlay")) $("bPlay").onclick = function(){
    if(playing){ stopPlay(); return; }
    if(frames.length<2){ alert(curLang==="tr"?"Oynatmak için en az 2 adım ekle":"Add at least 2 steps to play"); return; }
    playing = true; backup = clone(tokens); var seq = clone(frames); $("bPlay").textContent = t("btn_stop");
    var seg = 0, t0 = performance.now(), DUR = 1300, HOLD = 350;
    function step(now){
      if(!playing) return;
      var el = Math.max(0, now-t0), a = seq[seg], b = seq[seg+1];
      var k = Math.min(1, el/DUR), e = k<.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2;
      ALL.forEach(function(id){
        if(a[id] && b[id]) tokens[id] = {x: a[id].x+(b[id].x-a[id].x)*e, y: a[id].y+(b[id].y-a[id].y)*e};
      });
      draw();
      var cs = $("chips")?$("chips").children:[];
      for(var i=0; i<cs.length; i++) cs[i].classList.toggle("on", i===seg || i===seg+1 && k>.5);
      if(el >= DUR+HOLD){ seg++; t0 = now; if(seg >= seq.length-1){ stopPlay(); return; } }
      playRaf = requestAnimationFrame(step);
    }
    playRaf = requestAnimationFrame(step);
  };

  function lib(){try{return JSON.parse(localStorage.getItem("rlTactics")||"[]")}catch(_){return []}}
  function setLib(a){try{localStorage.setItem("rlTactics",JSON.stringify(a));return true}catch(_){return false}}

  function loadTactic(s){
    stopPlay(); clearHist(); strokes = {};
    mode = FORM[s.mode] ? s.mode : 1; ko = s.ko || 0; applyMode(mode); updKo();
    ALL.forEach(function(id){ var tPos = s.tokens && s.tokens[id]; if(tPos) tokens[id] = {x:tPos.x, y:tPos.y}; });
    labels = clone(s.labels || {});
    ALL.forEach(function(id){
      if(rows[id]){ rows[id].nm.value = (labels[id]||{}).n||""; rows[id].rl.value = (labels[id]||{}).r||""; }
    });
    reqRot(); frames = clone(s.frames || []); fsel = -1; renderChips();
    strokes = clone(s.strokes || {}); saveState(); draw();
  }

  function thumb(sv0){
    var cCanvas = document.createElement("canvas"); cCanvas.width = 1000; cCanvas.height = 640;
    var cCtx = cCanvas.getContext("2d");
    var origCtx = ctx, origCvs = cvs, origTok = clone(tokens), origMode = mode;

    mode = FORM[sv0.mode]?sv0.mode:1;
    tokens = sv0.tokens || {};
    cvs = cCanvas; ctx = cCtx;
    drawField(cCtx);
    Object.keys(sv0.strokes||{}).forEach(function(k){ drawStroke(sv0.strokes[k]); });
    drawTokens();

    tokens = origTok; mode = origMode; cvs = origCvs; ctx = origCtx;
    return cCanvas;
  }

  function renderLib(){
    var box = $("lib"), a = lib(); if(!box) return; box.textContent = "";
    if(!a.length){ box.textContent = t("no_tactics"); box.className = "hint"; return; }
    box.className = "";
    a.forEach(function(s, i){
      var r = document.createElement("div"); r.className = "lcard";
      var thCanvas = thumb(s);
      r.appendChild(thCanvas);
      var bar = document.createElement("div"); bar.className = "lb2";
      var n = document.createElement("span"); n.className = "ln"; n.textContent = s.name;
      var sm = document.createElement("small"); var nf = (s.frames||[]).length, mm = FORM[s.mode]?s.mode:1;
      sm.textContent = (nf>=2?nf+(curLang==="tr"?" adım":" steps"):(curLang==="tr"?"animasyonsuz":"no anim"))+" · "+mm+"v"+mm; n.appendChild(sm);
      var lBtn = document.createElement("button"); lBtn.textContent = curLang==="tr"?"Yükle":"Load";
      var cBtn = document.createElement("button"); cBtn.textContent = curLang==="tr"?"Kod":"Code";
      var dBtn = document.createElement("button"); dBtn.textContent = curLang==="tr"?"Sil":"Del"; dBtn.className = "ghost";
      bar.appendChild(n); bar.appendChild(lBtn); bar.appendChild(cBtn); bar.appendChild(dBtn); r.appendChild(bar); box.appendChild(r);
      twoTap(lBtn, function(){ loadTactic(s); });
      cBtn.onclick = function(){
        try {
          var codeStr = btoa(unescape(encodeURIComponent(JSON.stringify(s))));
          navigator.clipboard.writeText(codeStr);
          cBtn.textContent = curLang==="tr"?"Kopyalandı!":"Copied!";
          setTimeout(function(){ cBtn.textContent = curLang==="tr"?"Kod":"Code"; }, 2000);
        } catch(_) { alert("Kod oluşturulamadı"); }
      };
      twoTap(dBtn, function(){ var x = lib(); x.splice(i, 1); setLib(x); renderLib(); });
    });
  }

  if($("bSave")) $("bSave").onclick = function(){
    var name = $("sname").value.trim(); if(!name){ alert(curLang==="tr"?"Taktiğe bir isim ver":"Give your tactic a name"); return; }
    var a = lib().filter(function(s){ return s.name!==name; });
    var tacticObj = {name:name, mode:mode, ko:ko, tokens:snap(), labels:clone(labels), strokes:clone(strokes), frames:clone(frames)};
    a.unshift(tacticObj);
    if(setLib(a)){ 
      $("sname").value=""; 
      renderLib(); 
      try {
        var codeStr = btoa(unescape(encodeURIComponent(JSON.stringify(tacticObj))));
        navigator.clipboard.writeText(codeStr);
        alert(curLang==="tr" ? "Kaydedildi ve Paylaşım Kodu panoya kopyalandı!" : "Saved & Share code copied!");
      } catch(_) { alert(curLang==="tr"?"Kaydedildi":"Saved"); }
    } else alert(curLang==="tr"?"Hafıza dolu":"Storage Full");
  };

  if($("bLoadCode")) $("bLoadCode").onclick = function(){
    var codeVal = $("tcode").value.trim();
    if(!codeVal){ alert(curLang==="tr"?"Lütfen bir taktik kodu yapıştır":"Please paste a tactic code"); return; }
    try {
      var jsonStr = decodeURIComponent(escape(atob(codeVal)));
      var s = JSON.parse(jsonStr);
      if(!s.name || !s.tokens) throw new Error();
      var a = lib().filter(function(item){ return item.name !== s.name; });
      a.unshift(s);
      setLib(a);
      loadTactic(s);
      $("tcode").value = "";
      renderLib();
      alert(curLang==="tr" ? "Taktik yüklendi ve kütüphaneye eklendi!" : "Tactic imported successfully!");
    } catch(_) {
      alert(curLang==="tr" ? "Geçersiz taktik kodu!" : "Invalid tactic code!");
    }
  };

  // GELİŞMİŞ PRO AI ANALİZ MOTORU (HTML TEMİZLİĞİ İLE)
  function runAiAnalysis(){
    var report = $("aiReport");
    report.innerHTML = curLang==="tr" ? "AI Pozisyonu analiz ediyor..." : "AI analyzing position...";
    setTimeout(function(){
      var bX = tokens.ball.x, bY = tokens.ball.y;
      var zone = curLang==="tr" ? (bX < 350 ? "Kendi Savunma Bölgemiz" : (bX > 650 ? "Rakip Kalepolü / Baskı Alanı" : "Orta Saha Mücadele Alanı")) : (bX < 350 ? "Defensive Zone" : (bX > 650 ? "Opponent Pressure Zone" : "Midfield Neutral Zone"));
      
      var blueClosest = "b1", minD = 9999;
      for(var i=1; i<=mode; i++){
        var d = Math.hypot(tokens["b"+i].x - bX, tokens["b"+i].y - bY);
        if(d < minD){ minD = d; blueClosest = "b"+i; }
      }

      var text = "";
      if(curLang==="tr") {
        text = "PRO AI Taktiksel Durum Raporu (" + mode + "v" + mode + ")<br><br>";
        text += "Topun Bölgesi: " + zone + " (X: " + Math.round(bX) + ", Y: " + Math.round(bY) + ")<br>";
        text += "Topa En Yakın Oyuncu: Mavi " + blueClosest.toUpperCase() + "<br><br>";
        if(bX > 650) {
          text += "Hücum Stratejisi: Rakip kaleye baskı kuruldu. 1. adam şut çekerken, 2. adam arka direk bindirmesi yapmalı, son adam ise orta sahada güvenliği sağlamalı.";
        } else if(bX < 350) {
          text += "Savunma Alarmı: Kalenin önünde tehlike var! Kaleci açı kapatmalı, takım arkadaşları hızlıca rotasyona girerek boost toplamalı.";
        } else {
          text += "Geçiş Oyunu: Orta sahada top kontrolü kritik. Geniş alan paslarıyla rakip savunmanın dengesini bozun.";
        }
      } else {
        text = "PRO AI Tactical Status Report (" + mode + "v" + mode + ")<br><br>";
        text += "Ball Zone: " + zone + " (X: " + Math.round(bX) + ", Y: " + Math.round(bY) + ")<br>";
        text += "Closest to Ball: Blue " + blueClosest.toUpperCase() + "<br><br>";
        if(bX > 650) {
          text += "Attack Strategy: Pressure applied. 1st man shoots/passes, 2nd man reads backpost, last man holds midfield.";
        } else if(bX < 350) {
          text += "Defense Alert: Danger in defensive third! Goalie must clear, teammates need to rotate back safely.";
        } else {
          text += "Neutral Game: Midfield control is key. Use wide passes to break opponent's shape.";
        }
      }

      report.innerHTML = text;
    }, 500);
  }
  $("bRunAi").onclick = runAiAnalysis;
  runAiAnalysis();

  function applyLanguage(){
    document.querySelectorAll("[data-i18n]").forEach(function(el){
      var k = el.getAttribute("data-i18n"); if(t(k)) el.textContent = t(k);
    });
    updKo(); updSide(); renderChips(); renderLib(); runAiAnalysis();
  }

  if($("bLang")) $("bLang").onclick = function(){
    curLang = curLang === "tr" ? "en" : "tr";
    localStorage.setItem("rltactic_lang", curLang);
    applyLanguage();
  };

  applyMode(mode); updHist(); applyLanguage(); draw();
  renderLib();
})();
</script>
</body>
